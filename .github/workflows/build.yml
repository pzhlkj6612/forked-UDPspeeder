name: Build

on:
  push:
    branches: ["branch_libev"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        method: [make, cmake]
        os:
          # amd64
          - windows-latest
          - ubuntu-latest
          - macos-26-intel
          # arm64
          - windows-11-arm
          - ubuntu-24.04-arm
          - macos-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Windows - Setup MSYS2
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            base-devel
            make
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-make

      - name: Linux - Install Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt update && \
          sudo apt install -y build-essential cmake make

      - name: Build with make (Windows)
        if: runner.os == 'Windows' && matrix.method == 'make'
        shell: msys2 {0}
        run: make mingw

      - name: Build with cmake (Windows)
        if: runner.os == 'Windows' && matrix.method == 'cmake' 
        shell: msys2 {0}
        run: |
          cmake -S . -B ../build -G "MinGW Makefiles"
          cmake --build ../build

      - name: Build with make (non-Windows)
        if: runner.os != 'Windows' && matrix.method == 'make'
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            make mac
          else
            make
          fi

      - name: Build with cmake (non-Windows)
        if: runner.os != 'Windows' && matrix.method == 'cmake'
        run: |
          cmake -S . -B ../build -DCMAKE_INSTALL_PREFIX=../install
          cmake --build ../build
          cmake --install ../build

      - name: Upload built program
        uses: actions/upload-artifact@v7
        with:
          name: build-${{ matrix.os }}
          path: ../install
